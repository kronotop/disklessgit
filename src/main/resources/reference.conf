{
  server {
    host: 127.0.0.1
    port: 8080
  }

  management {
    host: 127.0.0.1
    port: 8081
  }

  http {
    thread_pool {
      min_threads: 8
      max_threads: 200
    }
  }

  kronotop {
    bootstrap_servers: ["localhost:5484"]
    socket_timeout: 30s
    connection_pool {
      max_connections: 64
      max_wait: 10s
    }
  }

  dfs {
    block_cache {
      block_size: 64KiB
      block_limit: 32MiB
    }
  }
}